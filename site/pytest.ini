[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = website.settings
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*

# Test discovery paths
testpaths = 
    office/tests
    churchcal/tests
    bible/tests
    psalter/tests
    hymnal/tests
    sermons/tests

# pytest-django settings
django_find_project = true

# Coverage settings
addopts =
    --verbose
    --strict-markers
    --strict-config
    --cov=office
    --cov=churchcal
    --cov=bible
    --cov=psalter
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=0
    --no-cov-on-fail
    -ra
    -n auto
    --maxfail=10
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external services)
    e2e: End-to-end tests (full stack)
    slow: Slow-running tests
    bug: Tests for specific bug fixes
    us1: Tests for User Story 1 (Morning Prayer)
    us2: Tests for User Story 2 (Evening Prayer)
    us3: Tests for User Story 3 (Midday Prayer)
    us4: Tests for User Story 4 (Compline)
    us5: Tests for User Story 5 (Navigation)
    us6: Tests for User Story 6 (Date Navigation)
    us7: Tests for User Story 7 (Family Prayer)

# Minimum coverage targets per Constitution Principle III
# P0 (Critical): 100% required
# P1 (High): 90% required
# P2 (Medium): 80% required

[coverage:run]
source = office,churchcal,bible,psalter
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    manage.py

[coverage:report]
precision = 2
skip_covered = False
skip_empty = True
sort = Cover

exclude_lines =
    # Default exclusions
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
