name: CI - Full Test Suite

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  setup:
    name: Setup and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Verify Podman installation
        run: |
          podman --version
          podman-compose --version

      - name: Cache Podman images
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml', 'site/Dockerfile.dev', 'app/Dockerfile.dev') }}
          restore-keys: |
            podman-images-${{ runner.os }}-

  backend:
    name: Backend Tests & Coverage
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Start services
        run: |
          podman-compose up -d db cache backend

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if podman-compose exec -T db pg_isready -U dailyoffice; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Load database dump
        run: |
          if [ -f site/dailyoffice_2024_01_30.sql.zip ]; then
            unzip -p site/dailyoffice_2024_01_30.sql.zip dailyoffice_2024_01_30.sql | \
              podman-compose exec -T db psql -U dailyoffice dailyoffice
          fi

      - name: Run Django checks
        run: |
          podman-compose exec -T backend python manage.py check

      - name: Run tests with coverage
        run: |
          podman-compose exec -T backend python -m pytest \
            --cov=office --cov=churchcal --cov=bible --cov=psalter \
            --cov-report=xml --cov-report=term-missing \
            --junit-xml=pytest-results.xml

      - name: Extract coverage
        if: always()
        run: |
          CONTAINER_ID=$(podman-compose ps -q backend)
          podman cp $CONTAINER_ID:/workspace/site/coverage.xml ./coverage.xml || true
          podman cp $CONTAINER_ID:/workspace/site/pytest-results.xml ./pytest-results.xml || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            coverage.xml
            pytest-results.xml

      - name: Stop services
        if: always()
        run: podman-compose down -v

  frontend:
    name: Frontend Tests
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Start frontend
        run: |
          podman-compose up -d frontend

      - name: Wait for npm install
        run: |
          sleep 30
          podman-compose exec -T frontend npm list || true

      - name: Run unit tests
        run: |
          podman-compose exec -T frontend npm run test:unit -- --run

      - name: Stop services
        if: always()
        run: podman-compose down -v

  formatting:
    name: Code Formatting Check
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Start backend
        run: |
          podman-compose up -d backend

      - name: Check Python formatting
        run: |
          podman-compose exec -T backend \
            find . -iname "*.py" -not -path "*/migrations/*" -not -path "*/__pycache__/*" -print0 | \
            xargs -0 black --check --target-version=py313 --line-length=119

      - name: Stop services
        if: always()
        run: podman-compose down -v

  report:
    name: Generate Test Report
    needs: [backend, frontend, formatting]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "# 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f coverage.xml ]; then
            echo "## Backend Coverage" >> $GITHUB_STEP_SUMMARY
            echo "✅ Coverage report generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Backend Coverage" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Coverage report not found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.backend.result }}" == "success" ] && \
             [ "${{ needs.frontend.result }}" == "success" ] && \
             [ "${{ needs.formatting.result }}" == "success" ]; then
            echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Backend: ${{ needs.backend.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Frontend: ${{ needs.frontend.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Formatting: ${{ needs.formatting.result }}" >> $GITHUB_STEP_SUMMARY
          fi
