services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: dailyoffice
      POSTGRES_USER: dailyoffice
      POSTGRES_PASSWORD: dailyoffice
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyoffice"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  cache:
    image: docker.io/library/memcached:1.6
    # Increase the max item size to prevent "object too large" errors when caching sizeable office data.
    command: ["memcached", "-m", "128", "-I", "5m"]
    ports:
      - "11211:11211"

  backend:
    build:
      context: ./site
      dockerfile: Dockerfile.dev
    env_file:
      - site/website/.env.compose
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_NAME: dailyoffice
      POSTGRES_USER: dailyoffice
      POSTGRES_PASSWORD: dailyoffice
      MEMCACHED_HOST: cache
      MEMCACHED_PORT: 11211
      SKIP_MIGRATIONS: "1"  # SQL dump already has tables, skip migrations
    volumes:
      - ./site:/workspace/site:Z
      - ./site/.cache:/workspace/site/.cache:Z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    env_file:
      - app/.env.development
    volumes:
      - ./app:/workspace/app:Z
      - app_node_modules:/workspace/app/node_modules:Z
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  e2e:
    image: mcr.microsoft.com/playwright:v1.56.1-jammy
    ipc: host
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
    volumes:
      - ./app:/workspace/app:Z
      - app_node_modules:/workspace/app/node_modules:Z
    working_dir: /workspace/app
    depends_on:
      frontend:
        condition: service_started

volumes:
  postgres_data:
  app_node_modules:
